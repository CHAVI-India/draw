# DRAW continuous pipeline — always-on, crash-recoverable GPU container (one hospital).
#
# Pulls a prebuilt image by default (set DRAW_IMAGE); falls back to building locally.
# Weights, DICOM, the SQLite queue, outputs, and logs are mounted from the host — no
# PHI or weights in the image. Schema auto-creates on startup; the lease/reaper recovers
# any study left in-flight by a killed container.
#
# Config comes from a .env file next to this compose file (see deploy/). Usage:
#   docker compose up -d
services:
  pipeline:
    image: ${DRAW_IMAGE:-draw:gpu}
    build: .                          # used only if the image isn't present locally
    pull_policy: ${DRAW_PULL_POLICY:-missing}
    command: ["start-pipeline"]
    restart: unless-stopped           # always-on; auto-restart on crash/reboot
    shm_size: "8gb"                   # nnU-Net dataloaders need a large /dev/shm
    environment:
      DB_URL: sqlite:////app/data/draw.db.sqlite
      DB_NAME: draw
      TABLE_NAME: dicom_log
      WATCH_DIR: /app/incoming
      MODEL_DEF_ROOT: config_yaml
      # File logging inside the container -> mounted ./logs volume (30-day retention,
      # gzip-compressed daily rotation, handled by the app).
      DRAW_LOG_FILE: /app/logs/draw.log
      DRAW_LOG_LEVEL: ${DRAW_LOG_LEVEL:-INFO}
    volumes:
      # WATCH_DIR is some external folder the scanner/PACS writes to (read-only here).
      - ${WATCH_DIR:?set WATCH_DIR in .env}:/app/incoming:ro
      # The rest live inside the deploy folder (default ./data, ./output, ./logs).
      - ${DATA_DIR:-./data}:/app/data
      - ${OUTPUT_DIR:-./output}:/app/output
      - ${LOG_DIR:-./logs}:/app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${DRAW_GPU_ID:-0}"]
              capabilities: ["gpu"]
    # Cap Docker's own json log so stdout duplication can't fill the disk (the app's
    # file logs are the retained copy).
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
